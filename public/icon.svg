<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE59F" />
      <stop offset="45%" stop-color="#E5BE65" />
      <stop offset="100%" stop-color="#AF8532" />
    </linearGradient>
    <linearGradient id="gold-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="30%" stop-color="#F5D77A" />
      <stop offset="100%" stop-color="#C9A24B" />
    </linearGradient>
    <linearGradient id="gold-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AA4F" />
      <stop offset="100%" stop-color="#8C6621" />
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#0B0B0B" stroke="#C9A24B" stroke-width="6" stroke-opacity="0.45" />

  <!-- Base plinth / foundation -->
  <rect x="75" y="420" width="362" height="12" rx="4" fill="url(#gold-grad)" />

  <!-- Left Building (Commercial) -->
  <rect x="112" y="200" width="74" height="20" rx="3" fill="url(#gold-grad)" />
  <rect x="92" y="220" width="94" height="200" rx="4" fill="url(#gold-grad)" />
  
  <!-- Left Building Windows -->
  <g fill="#0B0B0B">
    <rect x="108" y="238" width="22" height="26" rx="3" />
    <rect x="146" y="238" width="22" height="26" rx="3" />
    <rect x="108" y="282" width="22" height="26" rx="3" />
    <rect x="146" y="282" width="22" height="26" rx="3" />
    <rect x="108" y="326" width="22" height="26" rx="3" />
    <rect x="146" y="326" width="22" height="26" rx="3" />
    <rect x="108" y="370" width="22" height="26" rx="3" />
    <rect x="146" y="370" width="22" height="26" rx="3" />
  </g>

  <!-- Right Building (Angled Modern) -->
  <polygon points="326,230 420,262 420,420 326,420" fill="url(#gold-grad)" />
  <g fill="#0B0B0B">
    <rect x="344" y="278" width="24" height="26" rx="3" />
    <rect x="380" y="278" width="24" height="26" rx="3" />
    <rect x="344" y="323" width="24" height="26" rx="3" />
    <rect x="380" y="323" width="24" height="26" rx="3" />
    <rect x="344" y="368" width="24" height="26" rx="3" />
    <rect x="380" y="368" width="24" height="26" rx="3" />
  </g>

  <!-- Center Skyscraper (Tallest Tower) -->
  <polygon points="256,100 318,168 194,168" fill="url(#gold-highlight)" />
  <rect x="254" y="58" width="4" height="42" fill="#FFF3C4" />
  <!-- Spire star glint -->
  <circle cx="256" cy="56" r="6" fill="#FFFBE6" />
  <rect x="194" y="168" width="124" height="252" rx="4" fill="url(#gold-highlight)" />

  <!-- Center tower vertical architectural spine -->
  <rect x="254" y="168" width="4" height="252" fill="#0B0B0B" opacity="0.6" />

  <!-- Center Tower Windows -->
  <g fill="#0B0B0B">
    <!-- Row 1 -->
    <rect x="208" y="186" width="18" height="26" rx="3" />
    <rect x="233" y="186" width="14" height="26" rx="3" />
    <rect x="265" y="186" width="14" height="26" rx="3" />
    <rect x="286" y="186" width="18" height="26" rx="3" />
    <!-- Row 2 -->
    <rect x="208" y="231" width="18" height="26" rx="3" />
    <rect x="233" y="231" width="14" height="26" rx="3" />
    <rect x="265" y="231" width="14" height="26" rx="3" />
    <rect x="286" y="231" width="18" height="26" rx="3" />
    <!-- Row 3 -->
    <rect x="208" y="276" width="18" height="26" rx="3" />
    <rect x="233" y="276" width="14" height="26" rx="3" />
    <rect x="265" y="276" width="14" height="26" rx="3" />
    <rect x="286" y="276" width="18" height="26" rx="3" />
    <!-- Row 4 -->
    <rect x="208" y="321" width="18" height="26" rx="3" />
    <rect x="233" y="321" width="14" height="26" rx="3" />
    <rect x="265" y="321" width="14" height="26" rx="3" />
    <rect x="286" y="321" width="18" height="26" rx="3" />
    <!-- Row 5 -->
    <rect x="208" y="366" width="18" height="26" rx="3" />
    <rect x="233" y="366" width="14" height="26" rx="3" />
    <rect x="265" y="366" width="14" height="26" rx="3" />
    <rect x="286" y="366" width="18" height="26" rx="3" />
  </g>
</svg>
